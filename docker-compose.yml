name: ofos

services:
  # 1. PostgreSQL 17 Database
  postgres:
    image: postgres:17-alpine
    container_name: ofos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ofos_platform_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ofos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ofos_platform_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 In-Memory Cache & Lock Store
  redis:
    image: redis:7-alpine
    container_name: ofos-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ofos_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. OFOS NestJS REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ofos-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ofos_platform_dev}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-ofos_super_secret_access_jwt_production_key_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-ofos_super_secret_refresh_jwt_production_key_change_me}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    ports:
      - "3000:3000"

  # 4. OFOS React + Nginx Web Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ofos-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  ofos_pgdata:
    name: ofos_pgdata
  ofos_redisdata:
    name: ofos_redisdata
